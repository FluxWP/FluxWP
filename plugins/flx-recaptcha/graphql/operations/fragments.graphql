fragment FlxRecaptchaSettingsFields on FlxRecaptchaSettings {
  version
  siteKey
  siteKeyLocked
  secretSaved
  secretHint
  secretLocked
  threshold
  domain
  v2Theme
  v2Size
  hideBadge
  skipLoggedIn
  failOpen
  allowIps
  currentIp
  keysVerified
  disabledByConstant
  formsOverlap
}

fragment FlxRecaptchaFormRow on FlxRecaptchaForm {
  key
  label
  description
  group
  groupLabel
  available
  enabled
  passed
  blocked
}

fragment FlxRecaptchaStatusFields on FlxRecaptchaStatus {
  state
  version
  formsOn
  formsAvailable
  passed
  blocked
  lastTest {
    time {
      iso
      label
    }
    ok
    message
  }
  lastError {
    time {
      iso
      label
    }
    kind
    reason
    letPass
  }
}
