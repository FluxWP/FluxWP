    """Input for the flxBackupCancel mutation"""
    input: FlxBackupCancelInput!
  ): FlxBackupCancelPayload
  """
  Permanently deletes backups; a running one is cancelled first. Needs the highest permission.
  """
  flxBackupDelete(
    """Input for the flxBackupDelete mutation"""
    input: FlxBackupDeleteInput!
  ): FlxBackupDeletePayload
  """
  Locks a backup so the quota and retention never delete it, or unlocks it.
  """
  flxBackupLock(
    """Input for the flxBackupLock mutation"""
    input: FlxBackupLockInput!
  ): FlxBackupLockPayload
  """
  Starts restoring the chosen parts of a backup in the background. Overwrites the current database and files; needs the highest permission.
  """
  flxBackupRestoreStart(
    """Input for the flxBackupRestoreStart mutation"""
    input: FlxBackupRestoreStartInput!
  ): FlxBackupRestoreStartPayload
  """
  Saves Flux Backup settings. Fields you leave out stay as they are; values are limited to their range.
  """
  flxBackupSettingsSave(
    """Input for the flxBackupSettingsSave mutation"""
    input: FlxBackupSettingsSaveInput!
  ): FlxBackupSettingsSavePayload
  """
  Starts a backup in the background; poll flxBackupJob and call flxBackupStep to keep it moving. Conflict (errors) while another job runs.
  """
  flxBackupStart(
    """Input for the flxBackupStart mutation"""
    input: FlxBackupStartInput!
  ): FlxBackupStartPayload
