query FlxCommerceReportDays($first: Int = 50, $after: String, $preset: FlxCommerceReportPreset, $from: String, $to: String) {
  flxCommerceReportDays(first: $first, after: $after, preset: $preset, from: $from, to: $to) {
    nodes { date orders revenue { ...FlxCommerceMoney } }
    pageInfo { hasNextPage endCursor }
  }
}
