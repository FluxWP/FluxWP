extend type RootMutation {
  """
  Approves a payment awaiting approval: the order is paid, the certificate is made and sent.
  """
  flxDonationApprove(
    """Input for the flxDonationApprove mutation"""
    input: FlxDonationApproveInput!
  ): FlxDonationApprovePayload
  """
  Add a donation to the visitor&#039;s cart. Checkout stays on the Store API.
  """
  flxDonationCartAdd(
    """Input for the flxDonationCartAdd mutation"""
    input: FlxDonationCartAddInput!
  ): FlxDonationCartAddPayload
  """Makes the certificates of the order again or sends them."""
  flxDonationCertificates(
    """Input for the flxDonationCertificates mutation"""
    input: FlxDonationCertificatesInput!
  ): FlxDonationCertificatesPayload
  """Saves the person&#039;s order and folded boxes of the donation page."""
  flxDonationLayoutSave(
    """Input for the flxDonationLayoutSave mutation"""
    input: FlxDonationLayoutSaveInput!
  ): FlxDonationLayoutSavePayload
  """End the lookup session."""
  flxDonationLookupEnd(
    """Input for the flxDonationLookupEnd mutation"""
    input: FlxDonationLookupEndInput!
  ): FlxDonationLookupEndPayload
  """
  Send a code to view donations. The answer does not say whether a donation exists.
  """
  flxDonationLookupStart(
    """Input for the flxDonationLookupStart mutation"""
    input: FlxDonationLookupStartInput!
  ): FlxDonationLookupStartPayload
  """
  Open the lookup session with the code. A wrong code and an unknown address fail the same way.
  """
  flxDonationLookupVerify(
    """Input for the flxDonationLookupVerify mutation"""
    input: FlxDonationLookupVerifyInput!
  ): FlxDonationLookupVerifyPayload
  """Adds a note to the gift&#039;s WooCommerce order."""
  flxDonationNoteAdd(
    """Input for the flxDonationNoteAdd mutation"""
    input: FlxDonationNoteAddInput!
  ): FlxDonationNoteAddPayload
  """Deletes a note of the gift&#039;s WooCommerce order."""
  flxDonationNoteDelete(
    """Input for the flxDonationNoteDelete mutation"""
    input: FlxDonationNoteDeleteInput!
  ): FlxDonationNoteDeletePayload
  """Refunds an amount of the gift&#039;s WooCommerce order line."""
  flxDonationRefund(
    """Input for the flxDonationRefund mutation"""
    input: FlxDonationRefundInput!
  ): FlxDonationRefundPayload
  """Rejects a payment awaiting approval; the donation is canceled."""
  flxDonationReject(
    """Input for the flxDonationReject mutation"""
    input: FlxDonationRejectInput!
  ): FlxDonationRejectPayload
  """Corrects the names on whose behalf of the items."""
  flxDonationSaveNames(
    """Input for the flxDonationSaveNames mutation"""
    input: FlxDonationSaveNamesInput!
  ): FlxDonationSaveNamesPayload
  """
  Changes the referral of a gift (its whole order, recurring donation and certificates).
  """
  flxDonationSetReferral(
    """Input for the flxDonationSetReferral mutation"""
    input: FlxDonationSetReferralInput!
  ): FlxDonationSetReferralPayload
  """Changes the status of a gift; every item of its order follows."""
  flxDonationSetStatus(
    """Input for the flxDonationSetStatus mutation"""
    input: FlxDonationSetStatusInput!
  ): FlxDonationSetStatusPayload
  """
  Moves donations to the trash, restores or deletes them. An order&#039;s donations always move together, with the order.
  """
  flxDonationsBulk(
    """Input for the flxDonationsBulk mutation"""
    input: FlxDonationsBulkInput!
  ): FlxDonationsBulkPayload
}

extend type RootQuery {
  """Bank account shown on the donation page. Null when no IBAN is set."""
  flxDonationBankAccount: FlxDonationBankAccount
  """Donation dashboard of a period."""
  flxDonationDashboard(
    """First day of a custom period (Y-m-d)."""
    from: String
    """Period; default 30 days."""
    range: FlxDonationRange
    """Last day of a custom period (Y-m-d)."""
    to: String
  ): FlxDonationDashboard!
  """
  One donation as the wp-admin donation page shows it. Null when it does not exist or the user may not open it.
  """
  flxDonationDetail(
    """Donation id."""
    id: Int!
  ): FlxDonationDetail
  """
  Donation list of the wp-admin screen: an order is one row, open gifts first. Staff with flxb_view_own see only their referrals.
  """
  flxDonationList(
    """Cursor to continue after (pageInfo.endCursor)."""
    after: String
    """Filters."""
    filter: FlxDonationListFilter
    """Records per page (at most 50)."""
    first: Int
  ): FlxDonationListItemConnection!
  """
  Filter choices, totals, receipts awaiting approval and rights of the donation list.
  """
  flxDonationListInfo(
    """Filters (for the received total and the CSV link)."""
    filter: FlxDonationListFilter
  ): FlxDonationListInfo!
  """
  One public donation type, by id or slug. Null when it is missing or archived.
  """
  flxDonationType(
    """Type id."""
    id: Int
    """Type slug. Used when id is empty."""
    slug: String
  ): FlxDonationType
  """Donation types the public page lists. Archived types are left out."""
  flxDonationTypes(
    """Cursor to continue after (pageInfo.endCursor)."""
    after: String
    """Only this category. Empty lists every category."""
    category: String
    """Records per page (at most 50)."""
    first: Int
    """VISIBLE (default) or only types that are open today."""
    status: FlxDonationTypeList
  ): FlxDonationTypeConnection!
  """
  Donations of the signed-in donor, or of the lookup session. Nobody else&#039;s.
  """
  flxMyDonations(
    """Cursor to continue after (pageInfo.endCursor)."""
    after: String
    """Records per page (at most 50)."""
    first: Int
  ): FlxMyDonationConnection!
}
