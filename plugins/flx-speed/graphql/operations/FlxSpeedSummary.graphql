# Summary tab: hints and the numbers of the recorded requests.
query FlxSpeedSummary($hours: Int = 24) {
  flxSpeedHints {
    status
    label
    message
    actionUrl
    actionLabel
  }
  flxSpeedSummary(hours: $hours) {
    hours
    recorded
    msAvg
    msP95
    msMax
    flags {
      key
      label
      count
      tone
    }
    byType {
      type
      label
      count
      msAvg
      msP50
      msP95
      msMax
    }
    slowestUrls {
      url
      count
      msAvg
      msMax
      errors
    }
    components {
      component
      requests
      queries
      msPerRequest
    }
    slowQueries {
      sql
      error
      component
      count
      msAvg
      msMax
      lastId
    }
    phpErrors {
      level
      message
      file
      component
      requests
      lastId
    }
    httpCalls {
      endpoint
      component
      count
      failed
      msAvg
      lastError
    }
  }
}
