  ): FlxAdsSpendPage!
  """Studio: what the editor offers and the drafts."""
  flxAdsStudio: FlxAdsStudioPage!
  """Budget and pause suggestions from the optimizer, and season reminders."""
  flxAdsSuggestions: FlxAdsSuggestionsPage!
  """Donor value by acquisition group, and the cohort table."""
  flxAdsValue(
    """Period, kind, channel and grouping. Empty uses the screen's defaults."""
    filter: FlxAdsFilterInput
  ): FlxAdsValuePage!
}
