  If a &#039;clientMutationId&#039; input is provided to the mutation, it will be returned as output on the mutation. This ID can be used by the client to track the progress of mutations and catch possible duplicate mutation submissions.
  """
  clientMutationId: String
  """
  Input problems to show next to the form fields. Empty when the mutation succeeded.
  """
  errors: [FlxUserError!]!
  """When it was applied."""
  wcBranded: FlxDateTime
}

"""Flux Mail"""
type FlxSettingsFlxiSettings {
  """
  E-posta altındaki çizim anahtarı (none, orman, tepeler, cizgi ya da ön ayarın eklediği).
  """
  footerArt: String
  """E-posta alt kısmındaki slogan."""
  tagline: String
}

"""Changes to Flux Mail. Only the fields you send are changed."""
input FlxSettingsFlxiSettingsInput {
  """
  E-posta altındaki çizim anahtarı (none, orman, tepeler, cizgi ya da ön ayarın eklediği).
  """
  footerArt: String
  """E-posta alt kısmındaki slogan."""
  tagline: String
}

extend type FlxSettings {
  """Flux Mail"""
  flxiSettings: FlxSettingsFlxiSettings
}

extend input FlxSettingsUpdateInput {
  """Flux Mail"""
  flxiSettings: FlxSettingsFlxiSettingsInput
}

extend type RootMutation {
  """Looks up SPF, DMARC and MX and stores the result."""
  flxMailDnsCheck(
    """Input for the flxMailDnsCheck mutation"""
    input: FlxMailDnsCheckInput!
  ): FlxMailDnsCheckPayload
  """Tests the saved mailbox login. The password is not returned."""
  flxMailImapTest(
    """Input for the flxMailImapTest mutation"""
    input: FlxMailImapTestInput!
  ): FlxMailImapTestPayload
  """Renders an email preview from saved or unsaved fields."""
  flxMailPreview(
    """Input for the flxMailPreview mutation"""
    input: FlxMailPreviewInput!
  ): FlxMailPreviewPayload
  """Exports the preview as a PDF."""
  flxMailPreviewPdf(
    """Input for the flxMailPreviewPdf mutation"""
    input: FlxMailPreviewPdfInput!
  ): FlxMailPreviewPdfPayload
  """
  Saves communication settings. A secret left empty keeps the stored one; __clear__ removes it.
  """
  flxMailSettingsUpdate(
    """Input for the flxMailSettingsUpdate mutation"""
    input: FlxMailSettingsUpdateInput!
  ): FlxMailSettingsUpdatePayload
  """Restores a template to its default content."""
  flxMailTemplateReset(
    """Input for the flxMailTemplateReset mutation"""
    input: FlxMailTemplateResetInput!
  ): FlxMailTemplateResetPayload
  """Saves one template, or turns it on or off."""
  flxMailTemplateUpdate(
    """Input for the flxMailTemplateUpdate mutation"""
    input: FlxMailTemplateUpdateInput!
  ): FlxMailTemplateUpdatePayload
  """
  Sends a test email to the current user, a template, or unsaved content.
  """
  flxMailTestSend(
    """Input for the flxMailTestSend mutation"""
    input: FlxMailTestSendInput!
  ): FlxMailTestSendPayload
  """Copies the logo, colors, sender and footer onto WooCommerce emails."""
  flxMailWcBrandApply(
    """Input for the flxMailWcBrandApply mutation"""
    input: FlxMailWcBrandApplyInput!
  ): FlxMailWcBrandApplyPayload
}

extend type RootQuery {
  """One send log row, with the body when logging bodies is on."""
  flxMailLog(
    """Row id."""
    id: Int!
  ): FlxMailLog
  """Send counts for the last 7 days."""
  flxMailLogStats: FlxMailLogStats!
  """Send log."""
  flxMailLogs(
    """Cursor to continue after (pageInfo.endCursor)."""
    after: String
    """Campaign id."""
    campaign: Int
    """email, whatsapp or sms."""
    channel: String
    """Records per page (at most 50)."""
    first: Int
    """Recipient or subject."""
    search: String
    """sent, failed, blocked or sending."""
    status: String
    """Template key."""
    template: String
  ): FlxMailLogConnection!
  """Communication settings."""
  flxMailSettings: FlxMailSettings!
  """
  System-check rows from this package. Hidden when Flux Speed owns the system screen.
  """
  flxMailSystemChecks: [FlxMailSystemCheck!]!
  """One email template, including the editor fields."""
  flxMailTemplate(
    """Template key."""
    key: ID!
  ): FlxMailTemplate
  """Email templates."""
  flxMailTemplates(
    """Cursor to continue after (pageInfo.endCursor)."""
    after: String
    """Records per page (at most 50)."""
    first: Int
    """Name, key or group contains."""
    search: String
  ): FlxMailTemplateConnection!
}
