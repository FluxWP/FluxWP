fragment FlxFormsDate on FlxDateTime {
  iso
  label
  relative
}

fragment FlxFormsAdminForm on FlxFormsAdminForm {
  databaseId
  title
  formType
  createdAt { ...FlxFormsDate }
  responses
  unread
  lastResponseAt { ...FlxFormsDate }
  shortcode
  editUrl
}

fragment FlxFormsEntryRow on FlxFormsEntry {
  databaseId
  formId
  formTitle
  trackCode
  createdAt { ...FlxFormsDate }
  read
  preview
}

fragment FlxFormsEntryFull on FlxFormsEntry {
  ...FlxFormsEntryRow
  ip
  closed
  fields { label value isLink }
  replies {
    databaseId
    body
    createdAt { ...FlxFormsDate }
    attachments
    byStaff
    author
    state
  }
}
fragment FlxFormsSettingsAll on FlxFormsSettings {
  bootstrap
  locationPicker
  sessionDuration
  trackCodeStyle
  shortCaptcha
  showUploadedFiles
  downloadButton
  adminSeesName
  siteKey
  silentCaptcha
  adminEmail
  fromEmail
  smtp
  weeklyReport
  emailStatsReport
  emailTemplate
  emailButtonColor
  emailButtonText
  smsSender
  smsAdminNumbers
  respPreset
  respBrandColor
  respPrimary
  respPrimaryDark
  respAccent
  respText
  respTextMuted
  respBgCard
  respBgMeta
  respBgTrack
  respBgResp
  respBgEditor
  respEditorText
  respEditorPh
  respBtnText
  respFontFamily
  respFontSize
  respCustomFont
  devMode
  secretKeySet
  fromHint
  trackShortcode
  canEmailReport
  canEmailStats
}

fragment FlxFormsPaymentsAll on FlxFormsPayments {
  available
  limit
  providers { id label active configured webhookUrl hint secretOption secretSet secretFixed }
  payments {
    id
    date { iso label relative }
    formId formName track provider type interval amount currency formatted status statusLabel tone reference email
  }
}

fragment FlxFormsAddonAll on FlxFormsAddon {
  key title description enabled available disabledFunctions missingFunctions
}
