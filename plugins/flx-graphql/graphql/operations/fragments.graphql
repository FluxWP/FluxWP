# Cart bridge (flxCart*): one fragment for every cart answer, so the cart screen, Flux Commerce and
# Flux Donate read the same shape.
fragment FlxCartMoney on FlxMoney {
  amount
  currency
  formatted
}

fragment FlxCartAddressFields on FlxCartAddress {
  firstName
  lastName
  company
  address1
  address2
  city
  state
  postcode
  country
  email
  phone
}

fragment FlxCartFields on FlxCart {
  token
  nonce
  itemsCount
  items {
    key
    kind
    productId
    type
    name
    sku
    permalink
    imageUrl
    imageAlt
    quantity
    quantityLimits {
      minimum
      maximum
      multipleOf
      editable
    }
    soldIndividually
    unitPrice {
      ...FlxCartMoney
    }
    regularPrice {
      ...FlxCartMoney
    }
    subtotal {
      ...FlxCartMoney
    }
    total {
      ...FlxCartMoney
    }
    tax {
      ...FlxCartMoney
    }
    variation {
      name
      value
    }
    itemData {
      name
      value
    }
  }
  coupons {
    code
    discountType
    discount {
      ...FlxCartMoney
    }
    discountTax {
      ...FlxCartMoney
    }
  }
  fees {
    key
    name
    total {
      ...FlxCartMoney
    }
    tax {
      ...FlxCartMoney
    }
  }
  totals {
    currency
    itemsSubtotal {
      ...FlxCartMoney
    }
    itemsTax {
      ...FlxCartMoney
    }
    fees {
      ...FlxCartMoney
    }
    discount {
      ...FlxCartMoney
    }
    shipping {
      ...FlxCartMoney
    }
    tax {
      ...FlxCartMoney
    }
    total {
      ...FlxCartMoney
    }
    taxLines {
      name
      rate
      price {
        ...FlxCartMoney
      }
    }
  }
  needsPayment
  needsShipping
  hasCalculatedShipping
  shippingPackages {
    packageId
    name
    rates {
      rateId
      methodId
      name
      description
      deliveryTime
      price {
        ...FlxCartMoney
      }
      selected
    }
  }
  paymentMethods
  paymentRequirements
  notices {
    code
    message
  }
  billingAddress {
    ...FlxCartAddressFields
  }
  shippingAddress {
    ...FlxCartAddressFields
  }
  checkout {
    endpoint
    pageUrl
    cartPageUrl
  }
}
