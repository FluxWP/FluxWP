# Light poll: counters, document digests and the events since the last poll.
query FlxAppSync($since: Int) {
  flxAppSync(since: $since) {
    counts {
      key
      value
    }
    hashes {
      me
      config
      manifest
    }
    events {
      event
      title
      body
      target
      params
      at
    }
    serverTime
  }
}
