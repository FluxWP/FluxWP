extend type RootMutation {
  """
  Writes several different prompts from one idea with the Flux AI text model. Uses Flux AI&#039;s budget.
  """
  flxStudioBrainstorm(
    """Input for the flxStudioBrainstorm mutation"""
    input: FlxStudioBrainstormInput!
  ): FlxStudioBrainstormPayload
  """
  Cancels a job: one not yet sent is dropped, a running one is stopped at the provider.
  """
  flxStudioCancel(
    """Input for the flxStudioCancel mutation"""
    input: FlxStudioCancelInput!
  ): FlxStudioCancelPayload
  """
  Turns a short draft into a detailed prompt with the Flux AI text model. Uses Flux AI&#039;s budget.
  """
  flxStudioEnhance(
    """Input for the flxStudioEnhance mutation"""
    input: FlxStudioEnhanceInput!
  ): FlxStudioEnhancePayload
  """
  Adds a folder. A parent the user cannot write to becomes the top level.
  """
  flxStudioFolderCreate(
    """Input for the flxStudioFolderCreate mutation"""
    input: FlxStudioFolderCreateInput!
  ): FlxStudioFolderCreatePayload
  """
  Deletes a folder; its items and subfolders move up one level (no file is deleted).
  """
  flxStudioFolderDelete(
    """Input for the flxStudioFolderDelete mutation"""
    input: FlxStudioFolderDeleteInput!
  ): FlxStudioFolderDeletePayload
  """
  Renames, shares or moves a folder (the owner or a Studio administrator). Fields you leave out stay as they are.
  """
  flxStudioFolderUpdate(
    """Input for the flxStudioFolderUpdate mutation"""
    input: FlxStudioFolderUpdateInput!
  ): FlxStudioFolderUpdatePayload
  """
  Queues a generation: one item per output, sent to Flux AI after the response. Follow the items with flxStudioPoll until they finish. For an area edit give parentId (the image) and maskUploadId.
  """
  flxStudioGenerate(
    """Input for the flxStudioGenerate mutation"""
    input: FlxStudioGenerateInput!
  ): FlxStudioGeneratePayload
  """Copies a finished item into the WordPress Media Library."""
  flxStudioItemToLibrary(
    """Input for the flxStudioItemToLibrary mutation"""
    input: FlxStudioItemToLibraryInput!
  ): FlxStudioItemToLibraryPayload
  """
  Stars an item, renames it or moves it to a folder. Fields you leave out stay as they are.
  """
  flxStudioItemUpdate(
    """Input for the flxStudioItemUpdate mutation"""
    input: FlxStudioItemUpdateInput!
  ): FlxStudioItemUpdatePayload
  """
  Deletes items and their files; running ones are cancelled at the provider. Items that are not the user&#039;s own are skipped.
  """
  flxStudioItemsDelete(
    """Input for the flxStudioItemsDelete mutation"""
    input: FlxStudioItemsDeleteInput!
  ): FlxStudioItemsDeletePayload
  """
  Moves items to a folder. Items that are not the user&#039;s own are skipped.
  """
  flxStudioItemsMove(
    """Input for the flxStudioItemsMove mutation"""
    input: FlxStudioItemsMoveInput!
  ): FlxStudioItemsMovePayload
  """Adds a person whose photos can be used as identity references."""
  flxStudioPersonCreate(
    """Input for the flxStudioPersonCreate mutation"""
    input: FlxStudioPersonCreateInput!
  ): FlxStudioPersonCreatePayload
  """Deletes a person and their photos; earlier generations stay."""
  flxStudioPersonDelete(
    """Input for the flxStudioPersonDelete mutation"""
    input: FlxStudioPersonDeleteInput!
  ): FlxStudioPersonDeletePayload
  """
  Renames a person (the owner or a Studio administrator). An empty name changes nothing.
  """
  flxStudioPersonRename(
    """Input for the flxStudioPersonRename mutation"""
    input: FlxStudioPersonRenameInput!
  ): FlxStudioPersonRenamePayload
  """
  Follows running jobs (at most 8): asks Flux AI and writes finished files into the items. A mutation because it changes items; the screen calls it every few seconds while something runs.
  """
  flxStudioPoll(
    """Input for the flxStudioPoll mutation"""
    input: FlxStudioPollInput!
  ): FlxStudioPollPayload
  """
  Saves an uploaded image as a reference or as a photo of a person. Upload it first with POST /wp-json/flx/v1/upload (context flx-studio/reference).
  """
  flxStudioRefCreate(
    """Input for the flxStudioRefCreate mutation"""
    input: FlxStudioRefCreateInput!
  ): FlxStudioRefCreatePayload
  """Deletes a reference or a person&#039;s photo and its files."""
  flxStudioRefDelete(
    """Input for the flxStudioRefDelete mutation"""
    input: FlxStudioRefDeleteInput!
  ): FlxStudioRefDeletePayload
  """
  Renames a reference, sets its role, or keeps / drops it in the saved list. Fields you leave out stay as they are.
  """
  flxStudioRefUpdate(
    """Input for the flxStudioRefUpdate mutation"""
    input: FlxStudioRefUpdateInput!
  ): FlxStudioRefUpdatePayload
  """
  Saves the Studio settings (Studio administrators). Fields you leave out stay as they are; values are clamped. API keys and the spending limit are in Flux AI.
  """
  flxStudioSettingsUpdate(
    """Input for the flxStudioSettingsUpdate mutation"""
    input: FlxStudioSettingsUpdateInput!
  ): FlxStudioSettingsUpdatePayload
  """Saves the current generation settings as a template."""
  flxStudioTemplateCreate(
    """Input for the flxStudioTemplateCreate mutation"""
    input: FlxStudioTemplateCreateInput!
  ): FlxStudioTemplateCreatePayload
  """Deletes a template (the owner or a Studio administrator)."""
  flxStudioTemplateDelete(
    """Input for the flxStudioTemplateDelete mutation"""
    input: FlxStudioTemplateDeleteInput!
  ): FlxStudioTemplateDeletePayload
}

