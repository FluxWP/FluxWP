extend type RootMutation {
  """
  Creates an audience in Meta from a CRM group, fills it, and optionally a lookalike.
  """
  flxAdsAudienceCreate(
    """Input for the flxAdsAudienceCreate mutation"""
    input: FlxAdsAudienceCreateInput!
  ): FlxAdsAudienceCreatePayload
  """Deletes an audience in Meta and in Flux Ads."""
  flxAdsAudienceDelete(
    """Input for the flxAdsAudienceDelete mutation"""
    input: FlxAdsAudienceDeleteInput!
  ): FlxAdsAudienceDeletePayload
  """Creates a lookalike audience from one of your own."""
  flxAdsAudienceLookalike(
    """Input for the flxAdsAudienceLookalike mutation"""
    input: FlxAdsAudienceLookalikeInput!
  ): FlxAdsAudienceLookalikePayload
  """Sends the current CRM group to the audience in Meta."""
  flxAdsAudienceSync(
    """Input for the flxAdsAudienceSync mutation"""
    input: FlxAdsAudienceSyncInput!
  ): FlxAdsAudienceSyncPayload
  """Changes the daily budget of a campaign or ad set in Meta."""
  flxAdsCampaignBudget(
    """Input for the flxAdsCampaignBudget mutation"""
    input: FlxAdsCampaignBudgetInput!
  ): FlxAdsCampaignBudgetPayload
  """Pauses or resumes a campaign, ad set or ad in Meta."""
  flxAdsCampaignStatus(
    """Input for the flxAdsCampaignStatus mutation"""
    input: FlxAdsCampaignStatusInput!
  ): FlxAdsCampaignStatusPayload
  """
  Tests one platform with a test event (Meta, TikTok) or the validation endpoint (GA4); nothing is recorded. Any settings sent are saved first, as the classic Test button does.
  """
  flxAdsConnectionTest(
    """Input for the flxAdsConnectionTest mutation"""
    input: FlxAdsConnectionTestInput!
  ): FlxAdsConnectionTestPayload
  """Deletes a draft. Nothing changes in Meta."""
  flxAdsDraftDelete(
    """Input for the flxAdsDraftDelete mutation"""
    input: FlxAdsDraftDeleteInput!
  ): FlxAdsDraftDeletePayload
  """Copies a draft."""
  flxAdsDraftDuplicate(
    """Input for the flxAdsDraftDuplicate mutation"""
    input: FlxAdsDraftDuplicateInput!
  ): FlxAdsDraftDuplicatePayload
  """
  Flux AI writes a draft from a brief (up to 90 seconds). Nothing reaches Meta.
  """
  flxAdsDraftGenerate(
    """Input for the flxAdsDraftGenerate mutation"""
    input: FlxAdsDraftGenerateInput!
  ): FlxAdsDraftGeneratePayload
  """
  Saves a Studio draft; a new one when no ID is given. Nothing reaches Meta.
  """
  flxAdsDraftSave(
    """Input for the flxAdsDraftSave mutation"""
    input: FlxAdsDraftSaveInput!
  ): FlxAdsDraftSavePayload
  """
  Creates the draft in Meta. The campaign, ad sets and ads are always created paused.
  """
  flxAdsDraftSend(
    """Input for the flxAdsDraftSend mutation"""
    input: FlxAdsDraftSendInput!
  ): FlxAdsDraftSendPayload
  """Starts a test. It only watches; it changes nothing in the ad account."""
  flxAdsExperimentCreate(
    """Input for the flxAdsExperimentCreate mutation"""
    input: FlxAdsExperimentCreateInput!
  ): FlxAdsExperimentCreatePayload
  """Deletes a test."""
  flxAdsExperimentDelete(
    """Input for the flxAdsExperimentDelete mutation"""
    input: FlxAdsExperimentDeleteInput!
  ): FlxAdsExperimentDeletePayload
  """Ends a test now."""
  flxAdsExperimentFinish(
    """Input for the flxAdsExperimentFinish mutation"""
    input: FlxAdsExperimentFinishInput!
  ): FlxAdsExperimentFinishPayload
  """Pauses the weaker ad of a finished test in Meta."""
  flxAdsExperimentPauseLoser(
    """Input for the flxAdsExperimentPauseLoser mutation"""
    input: FlxAdsExperimentPauseLoserInput!
  ): FlxAdsExperimentPauseLoserPayload
  """
  What the classic page does when it opens: send due conversions and read ad spend. The screen calls it now and then. Nothing is written to an ad account.
  """
  flxAdsHeartbeat(
    """Input for the flxAdsHeartbeat mutation"""
    input: FlxAdsHeartbeatInput!
  ): FlxAdsHeartbeatPayload
  """Adds a date of your own to the season plan."""
  flxAdsSeasonAdd(
    """Input for the flxAdsSeasonAdd mutation"""
    input: FlxAdsSeasonAddInput!
  ): FlxAdsSeasonAddPayload
  """Deletes a date you added."""
  flxAdsSeasonDelete(
    """Input for the flxAdsSeasonDelete mutation"""
    input: FlxAdsSeasonDeleteInput!
  ): FlxAdsSeasonDeletePayload
  """Sends a failed conversion again."""
  flxAdsSendRetry(
    """Input for the flxAdsSendRetry mutation"""
    input: FlxAdsSendRetryInput!
  ): FlxAdsSendRetryPayload
  """
  Saves tracking settings. A secret left empty keeps the stored one; &quot;__clear__&quot; removes it.
  """
  flxAdsSettingsSave(
    """Input for the flxAdsSettingsSave mutation"""
    input: FlxAdsSettingsSaveInput!
  ): FlxAdsSettingsSavePayload
  """
  Adds a spend row by hand (Google, TikTok or anything not read from Meta).
  """
  flxAdsSpendAdd(
    """Input for the flxAdsSpendAdd mutation"""
    input: FlxAdsSpendAddInput!
  ): FlxAdsSpendAddPayload
  """Deletes a spend row entered by hand."""
  flxAdsSpendDelete(
    """Input for the flxAdsSpendDelete mutation"""
    input: FlxAdsSpendDeleteInput!
  ): FlxAdsSpendDeletePayload
  """Reads ad spend from Meta now."""
  flxAdsSpendSync(
    """Input for the flxAdsSpendSync mutation"""
    input: FlxAdsSpendSyncInput!
  ): FlxAdsSpendSyncPayload
  """Applies a suggestion to the ad account."""
  flxAdsSuggestionApply(
    """Input for the flxAdsSuggestionApply mutation"""
    input: FlxAdsSuggestionApplyInput!
  ): FlxAdsSuggestionApplyPayload
  """Dismisses a suggestion."""
  flxAdsSuggestionDismiss(
    """Input for the flxAdsSuggestionDismiss mutation"""
    input: FlxAdsSuggestionDismissInput!
  ): FlxAdsSuggestionDismissPayload
  """Looks at the numbers again and writes new suggestions."""
  flxAdsSuggestionsRefresh(
    """Input for the flxAdsSuggestionsRefresh mutation"""
    input: FlxAdsSuggestionsRefreshInput!
  ): FlxAdsSuggestionsRefreshPayload
}

extend type RootQuery {
  """Audiences kept in Meta, and the CRM groups they can be built from."""
  flxAdsAudiences: FlxAdsAudiencesPage!
