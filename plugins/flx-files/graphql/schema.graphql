  This is an ID that can be passed to a mutation by the client to track the progress of mutations and catch possible duplicate mutation submissions.
  """
  clientMutationId: String
  """The new content."""
  content: String!
  """Refuse when a file with this name already exists."""
  createOnly: Boolean
  """
  Fingerprint of the content that was opened (FlxFilesFile.hash). When the file changed on the server since, the save is refused (CONFLICT).
  """
  hash: String
  """Path from the site folder."""
  path: String!
}

"""The payload for the flxFilesWrite mutation."""
type FlxFilesWritePayload {
  """
  If a &#039;clientMutationId&#039; input is provided to the mutation, it will be returned as output on the mutation. This ID can be used by the client to track the progress of mutations and catch possible duplicate mutation submissions.
  """
  clientMutationId: String
  """
  Input problems to show next to the form fields. Empty when the mutation succeeded.
  """
  errors: [FlxUserError!]!
  """The saved file (no content)."""
  file: FlxFilesFile
}

"""Input for the flxFilesZip mutation."""
input FlxFilesZipInput {
  """
  This is an ID that can be passed to a mutation by the client to track the progress of mutations and catch possible duplicate mutation submissions.
  """
  clientMutationId: String
  """Folder to create the archive in. Empty for the site folder."""
  folder: String
  """
  File name of the archive (".zip" is added). Empty: named after the entry.
  """
  name: String
  """Entries to archive."""
  paths: [String!]!
}

"""The payload for the flxFilesZip mutation."""
type FlxFilesZipPayload {
  """
  If a &#039;clientMutationId&#039; input is provided to the mutation, it will be returned as output on the mutation. This ID can be used by the client to track the progress of mutations and catch possible duplicate mutation submissions.
  """
  clientMutationId: String
  """
  Input problems to show next to the form fields. Empty when the mutation succeeded.
  """
  errors: [FlxUserError!]!
  """The archive."""
  item: FlxFilesItem
}

extend type RootMutation {
  """
  Flux AI proposes a change to a file. Nothing is saved: the screen shows the difference and the user saves.
  """
  flxFilesAiEdit(
    """Input for the flxFilesAiEdit mutation"""
    input: FlxFilesAiEditInput!
  ): FlxFilesAiEditPayload
  """
  Flux AI explains a file (or the selected part). Files that hold secrets are never sent.
  """
  flxFilesAiExplain(
    """Input for the flxFilesAiExplain mutation"""
    input: FlxFilesAiExplainInput!
  ): FlxFilesAiExplainPayload
  """
  Changes the permissions of a file or folder. World-writable modes (777 …) are refused.
  """
  flxFilesChmod(
    """Input for the flxFilesChmod mutation"""
    input: FlxFilesChmodInput!
  ): FlxFilesChmodPayload
  """Copies entries into a folder."""
  flxFilesCopy(
    """Input for the flxFilesCopy mutation"""
    input: FlxFilesCopyInput!
  ): FlxFilesCopyPayload
  """Copies each entry next to itself (&quot;name (2)&quot;)."""
  flxFilesDuplicate(
    """Input for the flxFilesDuplicate mutation"""
    input: FlxFilesDuplicateInput!
  ): FlxFilesDuplicatePayload
  """Creates a folder."""
  flxFilesFolderCreate(
    """Input for the flxFilesFolderCreate mutation"""
    input: FlxFilesFolderCreateInput!
  ): FlxFilesFolderCreatePayload
  """Moves entries into a folder."""
  flxFilesMove(
    """Input for the flxFilesMove mutation"""
    input: FlxFilesMoveInput!
  ): FlxFilesMovePayload
  """Renames a file or folder (it stays in its folder)."""
  flxFilesRename(
    """Input for the flxFilesRename mutation"""
    input: FlxFilesRenameInput!
  ): FlxFilesRenamePayload
  """
  Puts an earlier version of a file back. The current content is kept as a new version.
  """
  flxFilesRevert(
    """Input for the flxFilesRevert mutation"""
    input: FlxFilesRevertInput!
  ): FlxFilesRevertPayload
  """Changes Flux Files settings."""
  flxFilesSettingsUpdate(
    """Input for the flxFilesSettingsUpdate mutation"""
    input: FlxFilesSettingsUpdateInput!
  ): FlxFilesSettingsUpdatePayload
  """
  Shares an uploads folder on the site (or stops sharing). Visitors browse it where the shortcode is added.
  """
  flxFilesShare(
    """Input for the flxFilesShare mutation"""
    input: FlxFilesShareInput!
  ): FlxFilesSharePayload
  """Moves entries to the trash (nothing is deleted for good)."""
  flxFilesTrash(
    """Input for the flxFilesTrash mutation"""
    input: FlxFilesTrashInput!
  ): FlxFilesTrashPayload
  """Deletes trash entries for good. This cannot be undone."""
  flxFilesTrashPurge(
    """Input for the flxFilesTrashPurge mutation"""
    input: FlxFilesTrashPurgeInput!
  ): FlxFilesTrashPurgePayload
  """
  Puts entries back where they were (a number is added to the name when the place is taken).
  """
  flxFilesTrashRestore(
    """Input for the flxFilesTrashRestore mutation"""
    input: FlxFilesTrashRestoreInput!
  ): FlxFilesTrashRestorePayload
  """Extracts a ZIP file into a new folder next to it."""
  flxFilesUnzip(
    """Input for the flxFilesUnzip mutation"""
    input: FlxFilesUnzipInput!
  ): FlxFilesUnzipPayload
  """
  Saves a text file (creates it when new). The previous content is kept as a version.
  """
  flxFilesWrite(
    """Input for the flxFilesWrite mutation"""
    input: FlxFilesWriteInput!
  ): FlxFilesWritePayload
  """Puts entries in a new ZIP file."""
  flxFilesZip(
    """Input for the flxFilesZip mutation"""
    input: FlxFilesZipInput!
  ): FlxFilesZipPayload
}

extend type RootQuery {
  """What the Flux Files screen needs to know about this site."""
  flxFilesConfig: FlxFilesConfig!
  """
  Disk space the hosting account uses. Measuring runs in steps: while `scanning` is true, ask again in a few seconds.
  """
  flxFilesDisk(
    """Start a new measurement."""
    refresh: Boolean
  ): FlxFilesDisk!
  """
  Opens a text file for editing. Large (over 3 MB) and binary files are refused.
  """
  flxFilesFile(
    """Path from the site folder."""
    path: String!
  ): FlxFilesFile!
  """A folder of the site and, page by page, its entries."""
  flxFilesFolder(
    """Path from the site folder. Empty for the site folder itself."""
    path: String
  ): FlxFilesFolder!
  """The Activity log: who changed what, from where. Newest first."""
  flxFilesLog(
    """Cursor to continue after (pageInfo.endCursor)."""
    after: String
    """Records per page (at most 50)."""
    first: Int
    """Only rows about this path (or inside it)."""
    path: String
    """Only rows from this source."""
    via: FlxFilesVia
  ): FlxFilesLogEntryConnection!
  """
  Searches a folder (and everything below it) by name, and optionally inside text and code files.
  """
  flxFilesSearch(
    """Also search inside text and code files (up to 2 MB each)."""
    content: Boolean
    """Folder to search in. Empty for the site folder."""
    path: String
    """At least 2 characters."""
    query: String!
  ): FlxFilesSearchResult!
  """Flux Files settings."""
  flxFilesSettings: FlxFilesSettings!
  """The size of a file or of everything inside a folder."""
  flxFilesSize(
    """Path from the site folder."""
    path: String!
  ): FlxFilesSize!
  """The trash."""
  flxFilesTrash: FlxFilesTrash!
  """The text of an earlier version."""
  flxFilesVersionContent(
    """Path from the site folder."""
    path: String!
    """Version id (flxFilesVersions)."""
    versionId: String!
  ): String!
  """
  Earlier versions of a file, newest first (at most the number set in the settings).
  """
  flxFilesVersions(
    """Path from the site folder."""
    path: String!
  ): [FlxFilesVersion!]!
}
