# A page of the "all referrers" list.
query FlxAnalyticsReferrers($filter: FlxAnalyticsFilterInput, $q: String, $first: Int, $after: String) {
  flxAnalyticsReferrers(filter: $filter, q: $q, first: $first, after: $after) {
    totalCount pageInfo { hasNextPage endCursor }
    nodes { ...FlxAnalyticsReferrerRowFields }
  }
}
