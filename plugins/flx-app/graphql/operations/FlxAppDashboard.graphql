# The app home: cards and lists.
query FlxAppDashboard {
  flxAppDashboard {
    cards {
      id
      title
      value
      sub
      icon
      tone
      url
      open
      order
    }
    lists {
      id
      title
      icon
      url
      open
      order
      items {
        title
        sub
        meta
        url
      }
    }
  }
}
