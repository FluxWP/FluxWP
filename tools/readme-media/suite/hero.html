<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1600px;height:760px;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:radial-gradient(1200px 600px at 20% 10%,#2fbf8f55,transparent 60%),radial-gradient(900px 500px at 90% 100%,#0a7cff33,transparent 60%),linear-gradient(135deg,#0b3d2e,#0f5a43 55%,#123b33);position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:22px 22px}
.win{position:absolute;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 70px #0008,0 0 0 1px #ffffff22}
.win .bar{height:26px;background:#eef2ef;display:flex;align-items:center;gap:7px;padding-left:12px}
.win .bar i{width:10px;height:10px;border-radius:50%;background:#d6dcd8;display:block}
.win img{display:block;width:100%}
.phone{position:absolute;border-radius:34px;overflow:hidden;border:9px solid #0d1512;box-shadow:0 30px 70px #000a;background:#000}
.phone img{display:block;width:100%}
.tag{position:absolute;padding:8px 14px;border-radius:999px;background:#ffffffee;color:#0b3d2e;font-weight:600;font-size:17px;box-shadow:0 8px 24px #0005;display:flex;gap:8px;align-items:center}
</style></head><body><div class="dots"></div>
<div class="win" style="left:60px;top:150px;width:640px;transform:rotate(-4deg)"><div class="bar"><i></i><i></i><i></i></div><img src="A"></div>
<div class="win" style="left:900px;top:140px;width:640px;transform:rotate(4deg)"><div class="bar"><i></i><i></i><i></i></div><img src="C"></div>
<div class="win" style="left:420px;top:70px;width:760px;z-index:2"><div class="bar"><i></i><i></i><i></i></div><img src="B"></div>
<div class="phone" style="left:1180px;top:300px;width:230px;z-index:3;transform:rotate(3deg)"><img src="D"></div>
<div class="phone" style="left:200px;top:330px;width:210px;z-index:3;transform:rotate(-3deg)"><img src="E"></div>
<div class="tag" style="left:470px;top:640px;z-index:4">🌱 Donations</div>
<div class="tag" style="left:640px;top:640px;z-index:4">💬 WhatsApp & e-mail</div>
<div class="tag" style="left:880px;top:640px;z-index:4">🤖 AI & MCP</div>
<div class="tag" style="left:1040px;top:640px;z-index:4">📊 Analytics</div>
</body></html>
