name: Docker images

# Builds ghcr.io/fluxwp/wordpress:<tag> for amd64 + arm64.
# Sources live in docker/; nothing here touches plugin/theme releases.
# Daily rebuild picks up security fixes in the upstream images (PHP, Debian, Alpine).

on:
  push:
    branches: [main]
    paths:
      - 'docker/images/**'
      - 'docker/config/**'
      - 'docker/scripts/**'
      - 'docker/tools/build.py'
      - '.github/workflows/docker-images.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 docker/tools/build.py --matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Date tag
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/${{ matrix.dockerfile }}
          build-args: BASE=${{ matrix.base }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: false
          tags: |
            ghcr.io/fluxwp/wordpress:${{ matrix.tag }}
            ghcr.io/fluxwp/wordpress:${{ matrix.tag }}-${{ steps.date.outputs.date }}
          cache-from: type=gha,scope=docker-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.tag }}
