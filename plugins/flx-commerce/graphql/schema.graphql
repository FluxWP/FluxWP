extend type RootMutation {
  """
  Saves the bank transfer gateway. Fields you leave out stay as they are.
  """
  flxCommerceBankSettingsSave(
    """Input for the flxCommerceBankSettingsSave mutation"""
    input: FlxCommerceBankSettingsSaveInput!
  ): FlxCommerceBankSettingsSavePayload
  """
  Saves the shop note. NOT_FOUND when the customer is missing. INVALID_INPUT when the note is over 2000 characters.
  """
  flxCommerceCustomerNote(
    """Input for the flxCommerceCustomerNote mutation"""
    input: FlxCommerceCustomerNoteInput!
  ): FlxCommerceCustomerNotePayload
  """
  Rebuilds one page of the customer summary (100 orders). Call again with page + 1 until done.
  """
  flxCommerceCustomersRebuild(
    """Input for the flxCommerceCustomersRebuild mutation"""
    input: FlxCommerceCustomersRebuildInput!
  ): FlxCommerceCustomersRebuildPayload
  """Marks a bank transfer paid. CONFLICT when the order is not waiting."""
  flxCommerceReceiptApprove(
    """Input for the flxCommerceReceiptApprove mutation"""
    input: FlxCommerceReceiptApproveInput!
  ): FlxCommerceReceiptApprovePayload
  """
  Runs one bounded renewal pass (the same tick the hourly cron runs). The shutdown pump and cron stay scheduled.
  """
  flxCommerceRenewalsRun(
    """Input for the flxCommerceRenewalsRun mutation"""
    input: FlxCommerceRenewalsRunInput!
  ): FlxCommerceRenewalsRunPayload
  """
  Saves store settings. Fields you leave out stay as they are. The feed key is generated, not written here.
  """
  flxCommerceSettingsSave(
    """Input for the flxCommerceSettingsSave mutation"""
    input: FlxCommerceSettingsSaveInput!
  ): FlxCommerceSettingsSavePayload
  """Turns renewal off. Access lasts until the period ends."""
  flxCommerceSubscriptionCancel(
    """Input for the flxCommerceSubscriptionCancel mutation"""
    input: FlxCommerceSubscriptionCancelInput!
  ): FlxCommerceSubscriptionCancelPayload
  """Ends the subscription now."""
  flxCommerceSubscriptionEnd(
    """Input for the flxCommerceSubscriptionEnd mutation"""
    input: FlxCommerceSubscriptionEndInput!
  ): FlxCommerceSubscriptionEndPayload
  """Opens a renewal order now."""
  flxCommerceSubscriptionRenew(
    """Input for the flxCommerceSubscriptionRenew mutation"""
    input: FlxCommerceSubscriptionRenewInput!
  ): FlxCommerceSubscriptionRenewPayload
  """Turns renewal back on."""
  flxCommerceSubscriptionResume(
    """Input for the flxCommerceSubscriptionResume mutation"""
    input: FlxCommerceSubscriptionResumeInput!
  ): FlxCommerceSubscriptionResumePayload
  """
  The signed-in customer turns renewal off. FORBIDDEN for someone else subscription.
  """
  flxMySubscriptionCancel(
    """Input for the flxMySubscriptionCancel mutation"""
    input: FlxMySubscriptionCancelInput!
  ): FlxMySubscriptionCancelPayload
  """
  Removes the stored card. Later renewals use a payment link. The sealed token is deleted, not returned.
  """
  flxMySubscriptionForgetCard(
    """Input for the flxMySubscriptionForgetCard mutation"""
    input: FlxMySubscriptionForgetCardInput!
  ): FlxMySubscriptionForgetCardPayload
  """
  Opens a renewal and returns the payment link the account page redirects to.
  """
  flxMySubscriptionRenew(
    """Input for the flxMySubscriptionRenew mutation"""
    input: FlxMySubscriptionRenewInput!
  ): FlxMySubscriptionRenewPayload
  """The signed-in customer turns renewal back on."""
  flxMySubscriptionResume(
    """Input for the flxMySubscriptionResume mutation"""
    input: FlxMySubscriptionResumeInput!
  ): FlxMySubscriptionResumePayload
  """
  Adds a subscription to the cart. Public because the product page is public. Uses the cart bridge; checkout stays on the Store API.
  """
  flxSubscriptionCartAdd(
    """Input for the flxSubscriptionCartAdd mutation"""
    input: FlxSubscriptionCartAddInput!
  ): FlxSubscriptionCartAddPayload
}

