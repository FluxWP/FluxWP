# Public: drawing fields of one form. A private form is null for a visitor.
query FlxForm($id: ID!) {
  flxForm(id: $id) {
    id
    title
    formType
    steps
    buttonLabel
    successTitle
    successMessage
    currency
    stepList {
      number
      title
      help
    }
    fields {
      id
      type
      label
      required
      placeholder
      help
      step
      width
      defaultValue
      min
      max
      settings
      options {
        value
        label
        price
        image
      }
      rows {
        value
        label
      }
    }
  }
}
