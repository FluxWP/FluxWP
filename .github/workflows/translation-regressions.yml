name: Translation regressions
on:
  pull_request:
    paths:
      - 'tools/site-translations/**'
      - 'tools/readme-media/**'
      - '.github/workflows/translation-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'tools/site-translations/**'
      - 'tools/readme-media/**'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 tools/readme-media/capture-package.py --help
      - run: python3 -m unittest discover -s tools/readme-media/tests -p 'test_*.py'
