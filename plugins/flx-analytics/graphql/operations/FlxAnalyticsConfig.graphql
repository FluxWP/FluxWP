# Option lists, permissions and links every Analytics screen needs once.
query FlxAnalyticsConfig {
  flxAnalyticsConfig {
    presets { value label }
    kinds { value label }
    events { value label }
    channels { value label }
    segments { value label }
    funnelBy { value label }
    goals { value label }
    defaultGoal canManageRefs canManage ignoreBrowser
    fastEndpoint exportUrl homeUrl settingsUrl funnelSettingsUrl hasWorldMap
  }
}
