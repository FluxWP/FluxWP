extend type RootMutation {
  """Processes the waiting visits now."""
  flxAnalyticsAggregate(
    """Input for the flxAnalyticsAggregate mutation"""
    input: FlxAnalyticsAggregateInput!
  ): FlxAnalyticsAggregatePayload
  """Records whether this browser reached the fast endpoint."""
  flxAnalyticsFastTest(
    """Input for the flxAnalyticsFastTest mutation"""
    input: FlxAnalyticsFastTestInput!
  ): FlxAnalyticsFastTestPayload
  """
  Imports Koko Analytics history from before Flux Analytics was installed.
  """
  flxAnalyticsKokoImport(
    """Input for the flxAnalyticsKokoImport mutation"""
    input: FlxAnalyticsKokoImportInput!
  ): FlxAnalyticsKokoImportPayload
  """
  Adds a referral link name, renames it, or removes the name (the statistics stay).
  """
  flxAnalyticsRefSave(
    """Input for the flxAnalyticsRefSave mutation"""
    input: FlxAnalyticsRefSaveInput!
  ): FlxAnalyticsRefSavePayload
  """Deletes all statistics permanently."""
  flxAnalyticsReset(
    """Input for the flxAnalyticsReset mutation"""
    input: FlxAnalyticsResetInput!
  ): FlxAnalyticsResetPayload
  """Changes settings and funnels. Fields you do not send stay as they are."""
  flxAnalyticsSettingsSave(
    """Input for the flxAnalyticsSettingsSave mutation"""
    input: FlxAnalyticsSettingsSaveInput!
  ): FlxAnalyticsSettingsSavePayload
  """
  Removes one telemetry error record, or all of them with &quot;all&quot;. A record returns when the error happens again.
  """
  flxAnalyticsTelemetryForget(
    """Input for the flxAnalyticsTelemetryForget mutation"""
    input: FlxAnalyticsTelemetryForgetInput!
  ): FlxAnalyticsTelemetryForgetPayload
}

extend type RootQuery {
