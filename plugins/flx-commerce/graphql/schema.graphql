  """Length of the range in days."""
  days: Int!
  """First day, Y-m-d."""
  from: String!
  """Units sold."""
  items: Int!
  """Percent change in units."""
  itemsDelta: Float
  """Up to six products at or under the threshold."""
  lowStock: [FlxCommerceStock!]!
