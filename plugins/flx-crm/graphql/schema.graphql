extend type RootMutation {
  """
  Applies one action to up to 500 contacts: tag, role, archive, restore or delete.
  """
  flxContactBulk(
    """Input for the flxContactBulk mutation"""
    input: FlxContactBulkInput!
  ): FlxContactBulkPayload
  """
  Adds a contact by hand. A contact with the same e-mail or phone is not changed: it comes back with existed = true.
  """
  flxContactCreate(
    """Input for the flxContactCreate mutation"""
    input: FlxContactCreateInput!
  ): FlxContactCreatePayload
  """
  Deletes a contact with its timeline, tags and links. Donations and orders stay in their packages; a contact a package still uses cannot be deleted.
  """
  flxContactDelete(
    """Input for the flxContactDelete mutation"""
    input: FlxContactDeleteInput!
  ): FlxContactDeletePayload
  """Adds a note, call, meeting or sent e-mail to the timeline."""
  flxContactEventAdd(
    """Input for the flxContactEventAdd mutation"""
    input: FlxContactEventAddInput!
  ): FlxContactEventAddPayload
  """
  Deletes a timeline entry added by hand. Entries that come from a source (payments, messages) cannot be deleted.
  """
  flxContactEventDelete(
    """Input for the flxContactEventDelete mutation"""
    input: FlxContactEventDeleteInput!
  ): FlxContactEventDeletePayload
  """
  Merges duplicate cards into the one to keep; every package moves its records to it.
  """
  flxContactMerge(
    """Input for the flxContactMerge mutation"""
    input: FlxContactMergeInput!
  ): FlxContactMergePayload
  """
  Puts a tag on a contact, by ID or by name (a new name creates the tag).
  """
  flxContactTagAdd(
    """Input for the flxContactTagAdd mutation"""
    input: FlxContactTagAddInput!
  ): FlxContactTagAddPayload
  """Takes a tag off a contact."""
  flxContactTagRemove(
    """Input for the flxContactTagRemove mutation"""
    input: FlxContactTagRemoveInput!
  ): FlxContactTagRemovePayload
  """
  Changes a contact. Fields you leave out stay as they are; an empty value clears the field.
  """
  flxContactUpdate(
    """Input for the flxContactUpdate mutation"""
    input: FlxContactUpdateInput!
  ): FlxContactUpdatePayload
  """
  Recalculates the value scores and churn risk. Call again until done is true.
  """
  flxCrmScoreRun(
    """Input for the flxCrmScoreRun mutation"""
    input: FlxCrmScoreRunInput!
  ): FlxCrmScoreRunPayload
  """Saves the settings. Values you leave out stay as they are."""
  flxCrmSettingsSave(
    """Input for the flxCrmSettingsSave mutation"""
    input: FlxCrmSettingsSaveInput!
  ): FlxCrmSettingsSavePayload
  """
  Imports past records one step at a time. Start with no step; follow next and page until finished.
  """
  flxCrmSyncStep(
    """Input for the flxCrmSyncStep mutation"""
    input: FlxCrmSyncStepInput!
  ): FlxCrmSyncStepPayload
  """Deletes an event. Package records stay; they detach themselves."""
  flxGatheringDelete(
    """Input for the flxGatheringDelete mutation"""
    input: FlxGatheringDeleteInput!
  ): FlxGatheringDeletePayload
  """Creates or publishes the site page of an event."""
  flxGatheringEnsurePage(
    """Input for the flxGatheringEnsurePage mutation"""
    input: FlxGatheringEnsurePageInput!
  ): FlxGatheringEnsurePagePayload
  """Queues an event message through Flux Mail."""
  flxGatheringMessageSend(
    """Input for the flxGatheringMessageSend mutation"""
    input: FlxGatheringMessageSendInput!
  ): FlxGatheringMessageSendPayload
  """Creates an event, or updates one when an ID is given."""
  flxGatheringSave(
    """Input for the flxGatheringSave mutation"""
    input: FlxGatheringSaveInput!
  ): FlxGatheringSavePayload
  """Pauses, resumes or cancels every channel of one send."""
  flxGatheringSendControl(
    """Input for the flxGatheringSendControl mutation"""
    input: FlxGatheringSendControlInput!
  ): FlxGatheringSendControlPayload
  """Archives an event, or puts it back on the working list."""
  flxGatheringSetStatus(
    """Input for the flxGatheringSetStatus mutation"""
    input: FlxGatheringSetStatusInput!
  ): FlxGatheringSetStatusPayload
  """Deletes a journey and the progress of the people inside it."""
  flxJourneyDelete(
    """Input for the flxJourneyDelete mutation"""
    input: FlxJourneyDeleteInput!
  ): FlxJourneyDeletePayload
  """Adds a ready-made journey as a draft."""
  flxJourneyFromTemplate(
    """Input for the flxJourneyFromTemplate mutation"""
    input: FlxJourneyFromTemplateInput!
  ): FlxJourneyFromTemplatePayload
  """
  Creates a journey as a draft, or changes one when an ID is given (saving an active journey pauses it).
  """
  flxJourneySave(
    """Input for the flxJourneySave mutation"""
    input: FlxJourneySaveInput!
