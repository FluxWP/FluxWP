  Advances the running job by one time budget (about 8 seconds) and returns its state. Does nothing when no job runs.
  """
  flxBackupStep(
    """Input for the flxBackupStep mutation"""
    input: FlxBackupStepInput!
  ): FlxBackupStepPayload
}

