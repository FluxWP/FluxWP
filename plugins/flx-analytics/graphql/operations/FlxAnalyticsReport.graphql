# Everything the Statistics screen shows for a date range.
query FlxAnalyticsReport($filter: FlxAnalyticsFilterInput) {
  flxAnalyticsReport(filter: $filter) {
    range { ...FlxAnalyticsRangeFields }
    filter { seg rc }
    kpi { ...FlxAnalyticsKpiFields }
    pages { total items { ...FlxAnalyticsPageRowFields } }
    notFound { total items { ...FlxAnalyticsPageRowFields } }
    referrers { total items { ...FlxAnalyticsReferrerRowFields } }
    dims { kind total items { ...FlxAnalyticsDimRowFields } }
    segments { value label visitors pageviews }
    refs { ...FlxAnalyticsRefFields }
    funnel { ...FlxAnalyticsFunnelFields }
    eventSummary { name label hits uniques amount }
    events { total items { ...FlxAnalyticsEventRowFields } }
    realtime { ...FlxAnalyticsRealtimeFields }
  }
}
