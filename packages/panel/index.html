<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%BRAND_PRIMARY%" />
    <link rel="icon" href="./brand/icon.svg" type="image/svg+xml" />
    <title>%BRAND_NAME%</title>
    <script src="./boot-theme.js"></script>
    <style>
      html,body{margin:0;height:100%}
      #boot-splash{--bs-bg:#F3F2EF;--bs-text:#14171C;--bs-muted:#6B6F76;--bs-track:rgba(20,23,28,.08);--bs-primary:%BRAND_PRIMARY%;position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bs-bg);color:var(--bs-text);font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;transition:opacity .25s ease;-webkit-user-select:none;user-select:none;cursor:default}
      @media (prefers-color-scheme:dark){html:not([data-boot-theme=light]) #boot-splash{--bs-bg:#101114;--bs-text:#ECEDEF;--bs-muted:#8B9099;--bs-track:rgba(255,255,255,.08)}}
      html[data-boot-theme=dark] #boot-splash{--bs-bg:#101114;--bs-text:#ECEDEF;--bs-muted:#8B9099;--bs-track:rgba(255,255,255,.08)}
      #boot-splash.out{opacity:0;pointer-events:none}
      #boot-splash.gone{display:none}
      #boot-splash .bs-mark{position:relative;width:72px;height:72px;display:grid;place-items:center}
      #boot-splash .bs-mark img{width:72px;height:72px;object-fit:contain;border-radius:18px;animation:bs-breathe 1.8s ease-in-out infinite}
      #boot-splash .bs-site{display:none;background:#fff;box-shadow:0 8px 24px -10px rgba(0,0,0,.35)}
      #boot-splash.has-site .bs-site{display:block}
      #boot-splash.has-site .bs-app{display:none}
      #boot-splash .bs-title{font-size:15px;font-weight:600;min-height:21px;text-align:center;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      #boot-splash .bs-bar{position:relative;width:148px;height:3px;border-radius:3px;background:var(--bs-track);overflow:hidden}
      #boot-splash .bs-bar::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;border-radius:3px;background:var(--bs-primary);animation:bs-slide 1.1s cubic-bezier(.4,0,.2,1) infinite}
      #boot-splash .bs-bar.det::after{width:calc(var(--p,0) * 100%);animation:none;transition:width .3s ease}
      #boot-splash .bs-status{min-height:18px;font-size:12px;color:var(--bs-muted);text-align:center;max-width:80vw}
      @keyframes bs-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @keyframes bs-breathe{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
      @media (prefers-reduced-motion:reduce){#boot-splash .bs-mark img{animation:none}#boot-splash .bs-bar::after{animation-duration:2.4s}}
    </style>
  </head>
  <body>
    <div id="boot-splash" role="progressbar" aria-busy="true" aria-label="%BRAND_NAME%" data-tauri-drag-region>
      <div class="bs-mark" data-tauri-drag-region>
        <img class="bs-app" src="./brand/icon.svg" alt="" draggable="false" />
        <img class="bs-site" alt="" draggable="false" />
      </div>
      <div class="bs-title" data-tauri-drag-region></div>
      <div class="bs-bar"></div>
      <div class="bs-status" data-tauri-drag-region></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
