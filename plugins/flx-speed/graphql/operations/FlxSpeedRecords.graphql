query FlxSpeedRecords($first: Int = 25, $after: String, $hours: Int, $flag: String, $type: String, $q: String, $slow: Boolean) {
  flxSpeedRecords(first: $first, after: $after, hours: $hours, flag: $flag, type: $type, q: $q, slow: $slow) {
    nodes {
      ...FlxSpeedRecordRow
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}
