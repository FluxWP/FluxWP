query FlxCommerceCustomer($id: ID!) {
  flxCommerceCustomer(id: $id) {
    ...FlxCommerceCustomerRow
    openOrders
    addresses { kind text }
    products { productId name quantity total { ...FlxCommerceMoney } }
    recentOrders { id number status statusLabel paid url total { ...FlxCommerceMoney } createdAt { ...FlxCommerceWhen } }
    timeline { type label title text url paid at { ...FlxCommerceWhen } }
    person { databaseId email }
  }
}
