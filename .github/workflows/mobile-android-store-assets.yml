name: Android native store screenshots
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful FluxWP Android AAB build run with identical app inputs
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        locale: [tr-TR, en-US]
    env:
      SCREENSHOT_LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare verified Android QA package
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          mkdir -p release-out/android-qa
          gh release download 1.18.3 --repo google/bundletool --pattern bundletool-all-1.18.3.jar --dir release-out/android-qa
          mv release-out/android-qa/bundletool-all-1.18.3.jar release-out/android-qa/bundletool.jar
          node tools/release/prepare-android-capture.mjs
      - name: Enable isolated emulator acceleration
        run: |
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: python3 tools/release/android-native-capture.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-android-screens-${{ matrix.locale }}
          path: release-out/android-screens
          if-no-files-found: warn
          retention-days: 14
