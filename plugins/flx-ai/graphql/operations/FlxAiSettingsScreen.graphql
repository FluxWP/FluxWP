# Everything the Flux AI settings page shows: values, key status and the choices of its fields.
query FlxAiSettingsScreen {
  flxAiSettings {
    ...FlxAiSettingsFields
  }
  flxAiSecrets {
    ...FlxAiSecretFields
  }
  flxAiSettingsOptions {
    roles {
      id
      label
    }
    webProviders {
      id
      label
    }
    mediaModels {
      id
      label
      kind
      routes
      auto
    }
    mediaProviders {
      id
      label
    }
    defaultModel
    renderer
    webMonthCount
    providersReady
  }
}
