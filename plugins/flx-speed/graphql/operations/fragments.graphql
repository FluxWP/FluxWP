fragment FlxSpeedWhenFields on FlxSpeedWhen {
  timestamp
  short
  date
  relative
}

fragment FlxSpeedSectionFields on FlxSpeedSection {
  key
  title
  rows {
    label
    value
  }
}

fragment FlxSpeedRecordRow on FlxSpeedRecord {
  databaseId
  at {
    ...FlxSpeedWhenFields
  }
  url
  method
  type
  typeLabel
  status
  ms
  memKb
  queries
  queryMs
  http
  errors
  flags {
    key
    label
  }
  failed
}

fragment FlxSpeedSettingsFields on FlxSpeedSettings {
  panel
  panelFront
  caps
  record
  recordAdmins
  sample
  slowMs
  slowQueryMs
  keepDays
  maxRows
  diskQuotaGb
  loginSlug
  loginBlocked
  loginSlugLocked
  loginDisabled
  loginActive
  loginUrl
  loginPrefix
  loginMovedUrl
  mcpActive
  mcpTools
}

fragment FlxSpeedPageSpeedFields on FlxSpeedPageSpeed {
  toggles {
    key
    on
    forced
  }
  cssScope
  inlineKb
  safelist
  exclude
  skipUrls
  cssFiles
  jsFiles
  cacheBytes
  homeUrl
  offUrl
  auditUrl
  animations {
    name
    props
    file
    reduced
  }
  seenFiles
  seenAt {
    ...FlxSpeedWhenFields
  }
}

fragment FlxSpeedCacheFields on FlxSpeedCache {
  pendingError
  litespeedServer
  extensions {
    memcached
    redis
    sqlite3
    igbinary
  }
  litespeed {
    name
    installed
    active
    version
    pageCache
    object
    objectKind
    objectHost
  }
  sqlite {
    name
    installed
    active
    version
    fileName
    fileSize
  }
  dropinExists
  dropinOwner
  dropinName
  provider
  persistent
  conflicts {
    code
    text
    repairable
  }
  test {
    at {
      ...FlxSpeedWhenFields
    }
    provider
    persistent
    ms
    error
  }
  settingsUrls {
    litespeedPage
    litespeedObject
    sqlitePlugin
  }
  canInstall
}
