# Product telemetry overview and setup wizard numbers.
query FlxAnalyticsTelemetry($days: Int, $country: String) {
  flxAnalyticsTelemetry(days: $days, country: $country) {
    enabled endpoint days country
    countries { code name sites }
    overview {
      installs reports errorsOpen fatalOpen events
      appUsage { day platform accounts }
      usage { slug name sites topVersion }
      pairs { aName bName sites }
      combos { names sites }
      php { key label sites }
      wp { key label sites }
      locales { key label sites }
      countries { key label sites }
    }
    onboarding {
      runs done skipped left medianSeconds
      reach { step label count }
      stops { step label outcome count }
      cards { slug name picked dropped recOff }
      presets { key count }
      styles { key count }
    }
  }
}
