name: GraphQL schema and types

# Schema snapshot → breaking change check → codegen → typecheck of every client.
# A breaking change fails the check unless the PR has the "graphql-breaking" label.
#
# The snapshot is split by owner (docs/graphql/KURALLAR.md §7): packages/graphql/schema/core.graphql
# (WordPress / WPGraphQL) and plugins|themes/<slug>/graphql/schema.graphql. Generated TypeScript is not
# committed (bun install writes it). So parallel package pull requests do not touch the same files.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'packages/**'
      - 'apps/**'
      - 'tools/tests/wp-graphql/**'
      - 'tools/graphql/**'
      - 'docs/graphql/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'tools/ts-strict/**'
      - '.github/workflows/graphql.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'packages/graphql/**'
      - '.github/workflows/graphql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          tools: wp-cli
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - name: Package status files (docs/graphql/durum)
        run: bun tools/graphql/durum.ts --check

      - name: Schema snapshot
        env:
          TEST_ROOT: ${{ runner.temp }}/flx-test
        run: |
          # Base schema: the parts of the base commit, assembled (an old commit has the single snapshot).
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          mkdir -p "$RUNNER_TEMP/base"
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            git ls-tree -r --name-only "$base" \
              | grep -E '^(packages/graphql/schema/[^/]+\.graphql|(plugins|themes)/[^/]+/graphql/schema\.graphql)$' \
              | while read -r f; do mkdir -p "$RUNNER_TEMP/base/$(dirname "$f")"; git show "$base:$f" > "$RUNNER_TEMP/base/$f"; done
            bun packages/graphql/scripts/schema-parts.ts assemble --root "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/base.graphql" \
              || { echo "::warning::The base schema could not be assembled; the breaking change check is skipped."; rm -f "$RUNNER_TEMP/base.graphql"; }
          fi
          SCHEMA_RAW_DIR="$RUNNER_TEMP/schema-raw" bun run --filter @fluxwp/graphql schema
          parts=(packages/graphql/schema ':(glob)plugins/*/graphql/schema.graphql' ':(glob)themes/*/graphql/schema.graphql')
          changed="$(git status --porcelain -- "${parts[@]}")"
          [ -z "$changed" ] && exit 0
          echo "$changed"
          # Full diff in the log (local WP / theme / WooCommerce versions can produce a different snapshot);
          # the CI parts are also uploaded as the "graphql-schema-ci" artifact.
          echo "::group::Schema diff (CI output vs committed)"
          git diff -- "${parts[@]}" | head -n 3000
          git ls-files --others --exclude-standard -- "${parts[@]}" | while read -r f; do echo "+++ new: $f"; head -n 400 "$f"; done
          echo "::endgroup::"
          # The changed parts as one base64 tar.gz line, for sessions that cannot download artifacts:
          #   gh api repos/<owner>/<repo>/actions/jobs/<job id>/logs | bash tools/graphql/ci-parts.sh [plugins/<slug>]
          echo "$changed" | awk '{print $NF}' | while read -r f; do [ -f "$f" ] && echo "$f"; done > "$RUNNER_TEMP/parts.txt"
          if [ -s "$RUNNER_TEMP/parts.txt" ]; then
            echo "FLX-SCHEMA-PARTS-BEGIN $(tar -czf - -T "$RUNNER_TEMP/parts.txt" | base64 -w0) FLX-SCHEMA-PARTS-END"
          fi
          # The core part follows the WordPress / WPGraphQL release CI downloads: a difference there is only a
          # warning (whoever owns Flux GraphQL refreshes it), so a WordPress release does not stop every PR.
          # The rest of this job uses the CI output, so types and the breaking check still see the real schema.
          packages="$(echo "$changed" | awk '{print $NF}' | grep -v '^packages/graphql/schema/' | paste -sd ' ' - || true)"
          if echo "$changed" | awk '{print $NF}' | grep -q '^packages/graphql/schema/'; then
            echo "::warning title=Schema snapshot (core)::packages/graphql/schema/core.graphql differs from this CI run (WordPress / WPGraphQL version). Refresh it in a Flux GraphQL PR."
          fi
          if [ -n "$packages" ]; then
            echo "::error title=Schema snapshot::Out of date: $packages. Commit your package's part (graphql-schema-ci artifact, or 'bun run --filter @fluxwp/graphql schema -- plugins/<slug>')."
            exit 1
          fi

      - name: Upload the CI schema parts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: graphql-schema-ci
          path: |
            packages/graphql/schema/core.graphql
            plugins/*/graphql/schema.graphql
            themes/*/graphql/schema.graphql
          if-no-files-found: ignore
      - name: Upload the raw CI schema and owners
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: graphql-schema-raw
          path: ${{ runner.temp }}/schema-raw/
          if-no-files-found: ignore

      - name: Breaking changes
        env:
          FLX_GQL_ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'graphql-breaking') && '1' || '0' }}
        run: |
          if [ -s "$RUNNER_TEMP/base.graphql" ]; then
            cd packages/graphql && bun scripts/schema-diff.ts "$RUNNER_TEMP/base.graphql"
          else
            echo "No schema on the base commit; nothing to compare."
          fi

      # Writes the (uncommitted) TypeScript from the CI parts; fails when a committed manifest is stale.
      - name: Generated types and persisted manifests are current
        run: bun run --filter @fluxwp/graphql generate:check

      # Every client (panel, modules, wp-embed, desktop, mobile) compiles against the generated types.
      - name: Typecheck
        run: bunx turbo run typecheck
      # Packages in tools/ts-strict/strict.json: tsconfig.strict.json + no explicit any.
      - name: No explicit any
        run: bun tools/ts-strict/no-any.ts
      - name: Tests
        run: bunx turbo run test --filter=@fluxwp/graphql --filter=@fluxwp/core
