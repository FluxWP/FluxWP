<style>
:root{--display:"Nunito","Segoe UI",system-ui,sans-serif;--body:"Nunito Sans","Segoe UI",system-ui,sans-serif;--hand:"Caveat","Comic Sans MS",cursive}
*{box-sizing:border-box}
html,body{margin:0;background:#07402D;touch-action:manipulation}
.kapanis{min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow-y:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 70% at 50% 0%,#0E7A56 0%,#0A5A40 45%,#07402D 100%);color:#F4FBF7;text-align:center;overscroll-behavior:contain}
.kp-ic{width:min(420px,100%);display:grid;justify-items:center;gap:10px}
.kp-sahne{width:min(260px,70vw);height:auto;overflow:visible;margin-bottom:4px}
.kapanis h2{margin:0;font:900 clamp(26px,7.4vw,34px)/1.1 var(--display);letter-spacing:-.01em}
.kapanis p{margin:0;font:600 16.5px/1.5 var(--body);opacity:.95;max-width:30ch}
.kapanis .kp-el{font:700 clamp(22px,6.6vw,28px)/1.15 var(--hand);color:#B8EA8F;opacity:1;transform:rotate(-2deg)}
.kapanis .kp-org{font:800 13.5px/1.4 var(--display);opacity:.75;margin-top:4px}
.kp-dugmeler{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.kp-dugmeler a{border:0;border-radius:999px;padding:13px 20px;font:900 15px/1 var(--display);text-decoration:none;cursor:pointer}
.kp-site{background:#6DBE45;color:#082A1B;box-shadow:0 10px 24px -10px rgba(109,190,69,.8)}
.kp-dugmeler a:focus-visible{outline:3px solid #B8EA8F;outline-offset:3px}
.kp-tac,.kp-toprak{transform-box:fill-box;transform-origin:50% 100%}.kp-tac{transform-origin:50% 60%}
.kp-agac{transform-box:view-box;transform-origin:120px 190px}
.kp-y,.kp-kalpler path{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion:no-preference){
  .kapanis{animation:kpAc .6s ease-out}
  .kp-hale{transform-box:fill-box;transform-origin:50% 50%;animation:kpHale 3.6s ease-in-out 1.6s infinite}
  .kp-toprak{animation:kpToprak .6s cubic-bezier(.2,.9,.3,1.2) both}
  .kp-govde{stroke-dasharray:1;animation:kpGovde 1.1s .35s ease-out both}
  .kp-tac{animation:kpTac .7s cubic-bezier(.2,1.4,.4,1) both}.t1{animation-delay:1.1s}.t2{animation-delay:1.25s}.t3{animation-delay:1.4s}.t4{animation-delay:1.6s}
  .kp-agac{animation:kpSalla 5s ease-in-out 2.2s infinite}
  .kp-y{opacity:0;animation:kpYaprak 5.5s linear infinite}.y1{animation-delay:2.2s}.y2{animation-delay:3.4s}.y3{animation-delay:4.6s}.y4{animation-delay:5.6s}
  .kp-kalpler path{opacity:0;animation:kpKalp 4s ease-out infinite}.kp-k1{animation-delay:2s}.kp-k2{animation-delay:2.9s}.kp-k3{animation-delay:3.8s}
  .kp-yazi{animation:kpYazi .7s ease-out both}.z1{animation-delay:1.5s}.z2{animation-delay:1.75s}.z3{animation-delay:2.05s}.z4{animation-delay:2.3s}.z5{animation-delay:2.5s}
  @keyframes kpAc{from{opacity:0}}
  @keyframes kpHale{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.05);opacity:1}}
  @keyframes kpToprak{from{transform:scaleX(.3);opacity:0}}
  @keyframes kpGovde{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes kpTac{from{transform:scale(0);opacity:0}}
  @keyframes kpSalla{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
  @keyframes kpYaprak{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate(26px,150px) rotate(320deg)}}
  @keyframes kpKalp{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-8px) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(.9)}}
  @keyframes kpYazi{from{opacity:0;transform:translateY(14px)}}}
html,body{min-height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#0E7A56 0%,#0A5A40 45%,#07402D 100%) fixed}
.kapanis{position:relative;z-index:1;background:none!important;padding-bottom:calc(22vh + env(safe-area-inset-bottom,0px))!important}
.arka{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.tepeler{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh;min-height:150px}
.tepeler .s{transform-box:fill-box;transform-origin:50% 100%}
.kose{position:absolute;width:64px;height:auto;opacity:.12}
.kose.sol{left:-10px;top:12vh;transform:rotate(-14deg)}.kose.sag{right:-6px;top:6vh;width:84px;transform:rotate(12deg) scaleX(-1)}
.isik{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(184,234,143,.35),rgba(184,234,143,0) 70%)}
.i1{width:120px;height:120px;left:6%;top:8%}.i2{width:70px;height:70px;left:78%;top:22%}.i3{width:160px;height:160px;left:60%;top:-4%}
.i4{width:50px;height:50px;left:16%;top:42%}.i5{width:90px;height:90px;left:84%;top:52%}.i6{width:60px;height:60px;left:40%;top:30%}
@media (prefers-reduced-motion:no-preference){
  .tepeler .s{animation:fSalla 4.5s ease-in-out infinite}
  .isik{animation:isikSuz 9s ease-in-out infinite}.i2{animation-delay:-2s}.i3{animation-delay:-4s}.i4{animation-delay:-6s}.i5{animation-delay:-3s}.i6{animation-delay:-7s}
  @keyframes fSalla{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes isikSuz{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-18px);opacity:1}}}
