name: App store assets - native iPhone and iPad
on:
  workflow_dispatch:
    inputs:
      brand: { description: 'Brand in brands/<slug>', default: flux, required: true }
      simulator_release:
        description: Optional prepared native QA cache tag; empty builds from source
        default: ''
      capture_run_id:
        description: Reuse a successful native capture run without restarting devices
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: inputs.capture_run_id == '' && inputs.simulator_release == ''
    runs-on: macos-latest
    timeout-minutes: 100
    env:
      FLUX_BRAND: ${{ inputs.brand || 'flux' }}
      RELEASE_PLATFORM: ios
      RELEASE_DESTINATION: simulator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node tools/release/config.mjs
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tools/release
      - run: bun install --frozen-lockfile
      - name: Generate native app
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/mobile/ios
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/tools/release/Gemfile
        run: bundle exec pod install
      - name: Build real native simulator app
        run: node tools/release/ios-simulator.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: native-ios-simulator
          path: |
            release-out/ios/*-simulator.zip
            release-out/ios/native-build.json
          if-no-files-found: error
          retention-days: 7
  capture:
    needs: build
    if: ${{ !cancelled() && inputs.capture_run_id == '' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.simulator_release != '')) }}
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write # Reading the optional private draft QA release requires repository push access.
    strategy:
      fail-fast: false
      matrix:
        locale: [tr-TR, en-US]
        device: [iphone, ipad]
    env:
      FLUX_BRAND: ${{ inputs.brand || 'flux' }}
      RELEASE_PLATFORM: ios
      RELEASE_DESTINATION: simulator
      SIMULATOR_RELEASE: ${{ inputs.simulator_release }}
      SCREENSHOT_LOCALE: ${{ matrix.locale }}
      SCREENSHOT_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node tools/release/config.mjs
      - uses: actions/download-artifact@v5
        if: inputs.simulator_release == ''
        with:
          name: native-ios-simulator
          path: release-out/ios
      - name: Verify and prepare native app
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/prepare-simulator.mjs
      - name: Install native test project generator
        run: brew install xcodegen
      - name: Capture actual native app screens
        run: node tools/release/native-store-screenshots.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: native-screens-${{ matrix.device }}-${{ matrix.locale }}
          path: release-out/store-assets/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: native-debug-${{ matrix.device }}-${{ matrix.locale }}
          path: |
            release-out/store-assets/
            release-out/logs/
            release-out/capture-runner/attachments/
          include-hidden-files: true
          retention-days: 7
  bundle:
    needs: capture
    if: ${{ !cancelled() && (needs.capture.result == 'success' || (needs.capture.result == 'skipped' && inputs.capture_run_id != '')) }}
    runs-on: ubuntu-latest
    env:
      FLUX_BRAND: ${{ inputs.brand || 'flux' }}
      CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Validate reusable capture provenance
        if: inputs.capture_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/validate-capture-run.mjs
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.capture_run_id || github.run_id }}
          pattern: native-screens-*
          merge-multiple: true
          path: release-out/store-assets
      - run: node tools/release/merge-store-assets.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: appstore-screenshots
          path: release-out/store-assets/
          if-no-files-found: error
          retention-days: 30
