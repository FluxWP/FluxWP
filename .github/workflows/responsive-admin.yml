name: Admin responsive navigation

on:
  pull_request:
    paths:
      - 'plugins/flx-graphql/assets/js/responsive.js'
      - 'tools/tests/responsive/**'
      - '.github/workflows/responsive-admin.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/flx-graphql/assets/js/responsive.js'
      - 'tools/tests/responsive/**'
      - '.github/workflows/responsive-admin.yml'

permissions:
  contents: read

jobs:
  tabs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: node --test tools/tests/responsive/navigation.test.mjs
