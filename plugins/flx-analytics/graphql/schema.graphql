  flxAnalyticsEvents(
    """Cursor to continue after (pageInfo.endCursor)."""
    after: String
    """Date range and visitor filters."""
    filter: FlxAnalyticsFilterInput
    """Records per page (at most 50)."""
    first: Int
    """Only this event; empty = all."""
    name: String
  ): FlxAnalyticsEventRowConnection!
  """A funnel, optionally split by channel, site, code, role or country."""
  flxAnalyticsFunnel(
    """How to split it (default total)."""
    by: FlxAnalyticsFunnelBy = TOTAL
    """Date range and visitor filters."""
    filter: FlxAnalyticsFilterInput
    """Funnel number; 0 or none = the first."""
    id: Int = 0
  ): FlxAnalyticsFunnel!
  """How visitors move through the site: flow chart and frequent paths."""
  flxAnalyticsJourneys(
    """Date range and visitor filters."""
    filter: FlxAnalyticsFilterInput
    """Steps, filters, goal and grouping."""
    options: FlxAnalyticsJourneysInput
  ): FlxAnalyticsJourneys!
  """Views of one page or post."""
  flxAnalyticsPage(
    """Date range and visitor filters."""
    filter: FlxAnalyticsFilterInput
    """Post ID, path or address."""
    target: String!
  ): FlxAnalyticsPageStats!
  """Pages by views, a page at a time."""
  flxAnalyticsPages(
    """Cursor to continue after (pageInfo.endCursor)."""
    after: String
    """Date range and visitor filters."""
    filter: FlxAnalyticsFilterInput
    """Records per page (at most 50)."""
    first: Int
    """Only addresses that were not found."""
    only404: Boolean = false
    """Text in the address."""
    q: String
  ): FlxAnalyticsPageRowConnection!
  """
  Who is on the site now; with kpi the headline numbers and chart too (a light query to repeat every few seconds).
  """
  flxAnalyticsRealtime(
    """Date range and visitor filters."""
    filter: FlxAnalyticsFilterInput
    """Include the headline numbers and chart."""
    kpi: Boolean = false
    """Window in minutes, 1–60 (default 30)."""
    minutes: Int = 30
  ): FlxAnalyticsRealtime!
  """Referring sites by visitors, a page at a time."""
  flxAnalyticsReferrers(
    """Cursor to continue after (pageInfo.endCursor)."""
    after: String
    """Date range and visitor filters."""
    filter: FlxAnalyticsFilterInput
    """Records per page (at most 50)."""
    first: Int
    """Text in the domain name."""
    q: String
  ): FlxAnalyticsReferrerRowConnection!
  """Referral links with what their visitors did (50 at most)."""
  flxAnalyticsRefs(
    """Date range and visitor filters."""
    filter: FlxAnalyticsFilterInput
  ): [FlxAnalyticsRef!]!
  """Everything the Statistics screen shows for a date range."""
  flxAnalyticsReport(
    """Date range and visitor filters."""
    filter: FlxAnalyticsFilterInput
  ): FlxAnalyticsReport!
  """Flux Analytics settings and the data status."""
  flxAnalyticsSettings: FlxAnalyticsSettings!
  """
  Anonymous product telemetry from FluxWP installs: usage, versions and the setup wizard.
  """
  flxAnalyticsTelemetry(
    """Only installs of this country (two-letter code)."""
    country: String
    """Range in days: 7, 30 (default) or 90."""
    days: Int = 30
  ): FlxAnalyticsTelemetry!
  """Errors FluxWP installs reported, fatal first."""
  flxAnalyticsTelemetryErrors(
    """Only errors seen on installs of this country."""
    country: String
    """Range in days: 7, 30 (default) or 90."""
    days: Int = 30
    """Only this package."""
    plugin: String
    """fatal, or one PHP error type such as E_WARNING."""
    type: String
  ): FlxAnalyticsTmErrors!
}
