"""
Changes since a revision. A truncated page is ordered by rev ascending; continue from continueRev and continueId.
"""
type FlxChatUpdates {
  """Changed chats, oldest revision first, at most 50."""
  chats: [FlxChat!]!
  """Connection states. No secrets."""
  connections: [FlxChatConnState!]!
  """Pass as afterChat when truncated, otherwise 0."""
  continueId: Int!
  """Pass as since on the next poll."""
  continueRev: String!
  """Incoming lines for notifications."""
  incoming: [FlxChatIncoming!]!
  """New lines of the open chat, at most 50."""
  messages: [FlxChatMessage!]!
  """More new lines in the open chat. Ask again with a higher after."""
  messagesTruncated: Boolean!
  """Current revision. Do not use this as since while truncated is true."""
  rev: String!
  """More chats changed than this page holds."""
  truncated: Boolean!
  """Unread total the viewer can see."""
  unread: Int!
}

