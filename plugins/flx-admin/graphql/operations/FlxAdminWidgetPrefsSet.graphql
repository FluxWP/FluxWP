mutation FlxAdminWidgetPrefsSet($input: FlxAdminWidgetPrefsSetInput!) {
  flxAdminWidgetPrefsSet(input: $input) {
    html
    prefs {
      tasks {
        scope
        list
        chart
      }
      donations {
        days
        split
      }
    }
    errors {
      code
      message
      field
    }
  }
}
