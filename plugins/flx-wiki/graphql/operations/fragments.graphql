fragment FlxWikiSectionRow on FlxWikiSection {
  databaseId
  slug
  name
  description
  order
  pageCount
  url
}

fragment FlxWikiPageRow on FlxWikiPage {
  id
  databaseId
  title
  slug
  path
  status
  summary
  excerpt
  parentId
  menuOrder
  section {
    ...FlxWikiSectionRow
  }
  url
  markdownUrl
  modified {
    iso
    label
    relative
  }
  readMinutes
  editUrl
  canEdit
}

fragment FlxWikiSettingsFields on FlxSettingsWiki {
  enabled
  title
  intro
  base
  aiLinks
  editLink
  accent
  width
  nav
  toc
  ask
  askLimit
}
