fragment FlxCommerceMoney on FlxMoney { amount currency formatted }
fragment FlxCommerceWhen on FlxDateTime { iso timestamp label relative }
fragment FlxCommerceCustomerRow on FlxCommerceCustomer {
  id name email phone city orders userId guest note
  total { ...FlxCommerceMoney }
  firstAt { ...FlxCommerceWhen }
  lastAt { ...FlxCommerceWhen }
  lastDay lastOrderUrl
}
fragment FlxCommerceSubscriptionRow on FlxCommerceSubscription {
  id status hasAccess autoRenew autoCharge userId email name
  productId productName productUrl period paymentMethod
  parentOrderId lastOrderId renewalOrderId renewals renewNow payUrl lastOrderUrl cardLabel endReason whenLabel
  orderLinks { number url role }
  amount { ...FlxCommerceMoney }
  startedAt { ...FlxCommerceWhen }
  periodEnd { ...FlxCommerceWhen }
  cancelledAt { ...FlxCommerceWhen }
  endedAt { ...FlxCommerceWhen }
  nextChargeAt { ...FlxCommerceWhen }
  createdAt { ...FlxCommerceWhen }
}
