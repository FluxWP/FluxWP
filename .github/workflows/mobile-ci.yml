name: FluxWP Mobile CI
# apps/mobile (Expo) + the shared packages it uses. Shared package changes also run fluxapp-ci (desktop).
on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', 'brands/**', 'tools/fluxapp/**', 'tools/release/**', 'package.json', 'bun.lock', 'bunfig.toml', '.easignore', '.github/workflows/mobile-*.yml', '.github/workflows/app-distribution.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/**', 'brands/**', 'tools/fluxapp/**', 'tools/release/**', 'package.json', 'bun.lock', 'bunfig.toml', '.easignore', '.github/workflows/mobile-*.yml', '.github/workflows/app-distribution.yml']
permissions:
  contents: read
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - name: Release input and credential safety tests
        run: node --test tools/release/*.test.mjs
      - name: Brand pipeline
        run: bun test tools/fluxapp/brand.test.ts
      - name: Shared packages (typecheck + tests)
        run: bunx turbo run typecheck test --filter=@fluxwp/core --filter=@fluxwp/tokens --filter=@fluxwp/manifest --filter=@fluxwp/runtime
      - name: JSON Schemas are current
        run: bun packages/manifest/scripts/json-schema.ts --check
      - name: Typecheck
        working-directory: apps/mobile
        run: bun run typecheck
      - name: Lint
        working-directory: apps/mobile
        run: bun run lint
      - name: expo-doctor
        working-directory: apps/mobile
        run: bunx expo-doctor
      - name: Export (web + android + ios bundles)
        working-directory: apps/mobile
        run: bunx expo export --platform all --output-dir dist
