query FlxCommerceSummary($days: Int) {
  flxCommerceSummary(days: $days) {
    days from to awaiting customers newCustomers orders items
    revenue { ...FlxCommerceMoney }
    aov { ...FlxCommerceMoney }
    revenueDelta ordersDelta aovDelta itemsDelta
    series { date orders revenue { ...FlxCommerceMoney } }
    lowStock { id name sku stock url }
    lowStockThreshold period
    awaitingOrders { id number name method ago total receiptIn statusLabel url }
  }
  flxCommerceMoneyFormat { symbol position decimal thousand }
  flxCommerceReceipts(first: 20) {
    nodes { id number name email reference status statusLabel files { name url } total { ...FlxCommerceMoney } createdAt { ...FlxCommerceWhen } }
    pageInfo { hasNextPage endCursor }
    totalCount
  }
}
