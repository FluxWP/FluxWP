# Everything the Wiki screen needs on open: settings, addresses, AI state and the sections.
query FlxWikiScreen {
  flxWikiOverview {
    homeUrl
    siteUrl
    base
    llmsUrl
    llmsFullUrl
    searchApi
    mcpEnabled
    mcpTools
    aiInstalled
    aiReady
    guideCount
    publishedCount
    defaultTitle
    defaultIntro
    newPageUrl
  }
  flxSettings {
    wiki {
      ...FlxWikiSettingsFields
    }
  }
  flxWikiSections {
    ...FlxWikiSectionRow
  }
}
