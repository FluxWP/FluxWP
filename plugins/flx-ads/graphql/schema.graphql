    id: String!
  ): FlxAdsDraft
  """What the new test form offers."""
  flxAdsExperimentChoices: FlxAdsExperimentChoices!
  """Tests: two ads side by side, or a group held out of the ads."""
  flxAdsExperiments: [FlxAdsExperiment!]!
  """What the tracked link builder offers."""
