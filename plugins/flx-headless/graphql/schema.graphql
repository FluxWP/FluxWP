"""
What WordPress does with its own theme pages once a front end serves the site.
"""
enum FlxHeadlessWpFront {
  """WordPress keeps showing its pages (both sites are open)."""
  KEEP
  """
  WordPress pages stay open but tell search engines the front end is the real address (noindex + canonical).
  """
  NOINDEX
  """
  Visitors are sent to the same address on the default front end (301). Cart, checkout, account, previews and editors stay on WordPress.
  """
  REDIRECT
}

