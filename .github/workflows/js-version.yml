name: JS package versions

# @fluxwp/modules and @fluxwp/graphql are versioned at release time, not in PRs:
#   PR   -> adds .changes/<name>.md; this workflow only checks the notes and that nobody bumped versions.
#   Run  -> (workflow_dispatch) bumps package.json, writes CHANGELOG, deletes the notes and opens a
#           "Release JS packages" PR (main is protected, no direct push). Merging it tags
#           modules-v<ver> / graphql-v<ver> and creates the GitHub releases (job "tag").
# Details: .changes/README.md

on:
  pull_request:
    paths:
      - '.changes/**'
      - 'packages/modules/package.json'
      - 'packages/modules/CHANGELOG.md'
      - 'packages/graphql/package.json'
      - 'packages/graphql/CHANGELOG.md'
      - 'tools/release/version-packages*.mjs'
      - '.github/workflows/js-version.yml'
  push:
    branches: [main]
    paths:
      - 'packages/modules/package.json'
      - 'packages/graphql/package.json'
  workflow_dispatch:

concurrency:
  group: js-version-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tools/release/version-packages.test.mjs
      - name: Notes valid, versions untouched
        run: node tools/release/version-packages.mjs --check "origin/${{ github.base_ref }}"

  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tools/release/version-packages.test.mjs
      - name: Bump versions
        id: bump
        run: node tools/release/version-packages.mjs
      - name: Open release PR
        if: steps.bump.outputs.summary != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          set -euo pipefail
          branch="release/js-packages-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add -A .changes packages/modules packages/graphql
          git commit -q -m "Release JS packages: $SUMMARY"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Release JS packages: $SUMMARY" \
            --body "Versions and CHANGELOGs computed from the pending \`.changes\` notes. Merging tags the releases."
          echo "::notice::Release PR opened for: $SUMMARY"

  tag:
    # Runs when a merged commit changed a package version: tag + GitHub release per package.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tags and GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for entry in "modules packages/modules" "graphql packages/graphql"; do
            set -- $entry
            ver="$(node -p "require('./$2/package.json').version")"
            tag="$1-v$ver"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then continue; fi
            awk -v v="## $ver" '$0==v{f=1;next} /^## /{f=0} f' "$2/CHANGELOG.md" > "notes-$1.md"
            [ -s "notes-$1.md" ] || echo "- $1 $ver" > "notes-$1.md"
            git tag "$tag" HEAD
            git push -q origin "$tag"
            gh release create "$tag" --title "@fluxwp/$1 $ver" --notes-file "notes-$1.md" --target "$(git rev-parse HEAD)"
            echo "::notice::$tag released"
          done
