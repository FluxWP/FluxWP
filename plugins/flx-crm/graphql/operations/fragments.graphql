fragment FlxCrmMoney on FlxMoney {
  amount
  currency
  formatted
}

fragment FlxCrmWhen on FlxDateTime {
  iso
  timestamp
  label
  relative
}

fragment FlxCrmTag on FlxTag {
  databaseId
  name
  color
  count
}

# One line of the contact list (also the overview lists and the duplicates page).
fragment FlxCrmContactRow on FlxContact {
  id
  databaseId
  name
  email
  phone {
    e164
    display
  }
  avatar
  company
  city
  roles
  donations
  orders
  segment
  segmentLabel
  ltv {
    ...FlxCrmMoney
  }
  churn
  atRisk
  status
  lastActivityAt {
    ...FlxCrmWhen
  }
  lastPaidAt {
    ...FlxCrmWhen
  }
  createdAt {
    ...FlxCrmWhen
  }
  consent {
    email
    sms
    whatsapp
    ads
  }
  tags {
    ...FlxCrmTag
  }
}

# The whole contact card.
fragment FlxCrmContactCard on FlxContact {
  ...FlxCrmContactRow
  rawName
  country
  source
  sourceLabel
  utmSource
  utmCampaign
  userId
  ownerId
  ownerName
  note
  paidDays
  firstPaidAt {
    ...FlxCrmWhen
  }
  avgGapDays
  rfm {
    recency
    frequency
    monetary
  }
  consentAt {
    ...FlxCrmWhen
  }
  editUrl
  sources {
    label
    url
    date
  }
  sections {
    ...FlxCrmPersonSection
  }
}

fragment FlxCrmEvent on FlxContactEvent {
  databaseId
  contactId
  contactName
  type
  typeLabel
  icon
  source
  title
  body
  amount {
    ...FlxCrmMoney
  }
  paid
  status
  url
  userName
  at {
    ...FlxCrmWhen
  }
  answers {
    question
    answer
  }
  deletable
}

fragment FlxCrmSegmentRow on FlxSegment {
  databaseId
  name
  description
  count
  summary
  match
  rules {
    field
    op
    value
  }
}

fragment FlxCrmJourneyRow on FlxJourney {
  databaseId
  name
  status
  description
  triggerType
  triggerValue
  steps {
    type
    days
    hours
    subject
    text
    condition
    value
    tag
  }
  opts {
    goal
    reenterDays
    quietFrom
    quietTo
    capWeek
  }
  stats {
    entered
    finished
    goal
    sent
    skipped
    active
  }
}

fragment FlxCrmUserError on FlxUserError {
  code
  message
  field
}

fragment FlxCrmPersonSection on FlxPersonSection {
  id
  title
  placement
  package
  blocks {
    kind
    text
    columns
    items {
      label
      value
      url
      meta
      primary
    }
    rows {
      cells
      url
      label
      meta
    }
  }
}

fragment FlxCrmGatheringCard on FlxGathering {
  databaseId
  name
  status
  whenLabel
  place
  phaseTone
  phaseLabel
  peopleCount
  coverUrl
  dateDay
  dateMonth
  dateYear
  stats {
    label
    value
    hint
    progress
  }
  progress
  progressHint
  actions {
    label
    url
    target
    primary
  }
  mailReady
  postId
  pageState
  pageUrl
  pageTitle
  canCreatePage
  startsAt {
    ...FlxCrmWhen
  }
}

fragment FlxCrmGatheringDetail on FlxGathering {
  ...FlxCrmGatheringCard
  summary
  note
  address
  mapUrl
  deliveredCount
  sendCount
  reasons {
    label
    count
    percent
  }
  recentSends {
    ...FlxCrmGatheringSend
  }
}

fragment FlxCrmGatheringSend on FlxGatheringSend {
  eventId
  key
  overall
  overallLabel
  tone
  kind
  text
  at {
    ...FlxCrmWhen
  }
  sendAt {
    ...FlxCrmWhen
  }
  byName
  mediaId
  mediaUrl
  mediaIsImage
  thumbUrl
  channels {
    key
    label
    missing
    sent
    total
    failed
    skipped
    percent
    eta {
      ...FlxCrmWhen
    }
    campaignId
  }
  eta {
    ...FlxCrmWhen
  }
  delivered
  read
  replied
  optout
  failed
  reachedTotal
  canPause
  pending
}
